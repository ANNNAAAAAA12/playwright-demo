<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gatitos Playwright</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-50: #fff5f9;
      --pink-100: #ffe4ef;
      --pink-200: #ffc7dd;
      --pink-300: #ff9fc3;
      --pink-400: #ff6fa5;
      --pink-500: #f0468a;
      --pink-600: #d92f6f;
      --lilac: #b79bff;
      --plum: #4a1d3f;
      --plum-soft: #7a4b6b;
      --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
      --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --ease-out: cubic-bezier(.2, .8, .2, 1);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
    }

    * { box-sizing: border-box; }

    html { -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--body);
      color: var(--plum);
      background:
        radial-gradient(1200px 700px at 15% -10%, #ffd6e8 0%, transparent 60%),
        radial-gradient(900px 600px at 100% 10%, #efe0ff 0%, transparent 55%),
        linear-gradient(180deg, #fff0f6 0%, #ffe3ef 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* ---------- fondo vivo ---------- */
    .blobs, .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .blobs { z-index: 0; }
    .particles { z-index: 1; }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .blob:nth-child(1) { width: 380px; height: 380px; background: #ff9fc3; left: -100px; top: 30%; }
    .blob:nth-child(2) { width: 320px; height: 320px; background: #cbb3ff; right: -80px; top: 8%; animation-duration: 22s; animation-delay: -6s; }
    .blob:nth-child(3) { width: 300px; height: 300px; background: #ffc9a8; left: 40%; bottom: -120px; animation-duration: 26s; animation-delay: -12s; }
    @keyframes drift { to { transform: translate(60px, -50px) scale(1.15); } }

    .particle {
      position: absolute; bottom: -60px; line-height: 1; user-select: none;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: var(--o, .5); }
      50%  { transform: translate(var(--sway), -55vh) rotate(calc(var(--spin) * .5)); }
      90%  { opacity: var(--o, .5); }
      100% { transform: translate(calc(var(--sway) * -1), -115vh) rotate(var(--spin)); opacity: 0; }
    }

    /* ---------- estructura ---------- */
    main {
      position: relative; z-index: 2;
      max-width: 920px; margin: 0 auto;
      padding: 28px 16px 90px;
    }

    /* ---------- héroe ---------- */
    .hero { text-align: center; }

    .stage {
      position: relative;
      width: min(340px, 82vw);
      margin: 0 auto;
    }

    .cat-wrap { transform-origin: 50% 100%; cursor: pointer; padding-top: 8px; }
    .cat-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    .cat-wrap:focus-visible { outline: 3px solid var(--pink-500); outline-offset: 6px; border-radius: 30px; }

    h1 {
      margin: 6px 0 6px;
      font-family: var(--display); font-weight: 700;
      font-size: clamp(2.6rem, 9vw, 4.6rem);
      line-height: 1; letter-spacing: -.01em;
      cursor: default;
    }
    h1 .word { display: inline-block; white-space: nowrap; }
    h1 .letter {
      display: inline-block;
      text-shadow: 0 4px 0 #ffd0e2, 0 10px 22px rgba(240, 70, 138, .28);
    }
    h1:hover .letter { animation: hop .6s var(--spring) both; animation-delay: calc(var(--i) * 45ms); }
    @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px) rotate(-5deg); } 70% { transform: translateY(2px); } }

    .tagline {
      margin: 0 auto 6px; max-width: 34rem;
      font-size: 1.12rem; font-weight: 600; line-height: 1.5;
      color: var(--plum-soft);
    }

    /* ---------- tarjeta con gatitos asomados ---------- */
    .panel {
      position: relative;
      margin-top: 74px;
      padding: 30px clamp(18px, 4vw, 34px) 26px;
      background: rgba(255, 255, 255, .72);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 3px solid #fff;
      border-radius: 36px;
      box-shadow: 0 10px 0 var(--pink-200), 0 30px 60px rgba(240, 70, 138, .2);
    }

    .peek {
      position: absolute; top: -78px; width: 104px; z-index: 3; cursor: pointer;
      transform-origin: 50% 100%;
    }
    .peek svg { display: block; width: 100%; height: auto; overflow: visible; }
    .peek.left { left: 8%; }
    .peek.right { right: 8%; }
    .peek .head-sway { animation-duration: 6s; }
    .peek:hover { animation: wiggle .6s var(--spring); }
    @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg) translateY(-6px); } 60% { transform: rotate(5deg); } }

    .search { display: flex; gap: 12px; flex-wrap: wrap; }

    .field {
      flex: 1 1 260px;
      display: flex; align-items: center; gap: 10px;
      padding: 0 20px;
      background: #fff;
      border: 3px solid var(--pink-200);
      border-radius: 999px;
      transition: border-color .25s, box-shadow .25s, transform .35s var(--spring);
    }
    .field:focus-within {
      border-color: var(--pink-400);
      box-shadow: 0 0 0 6px rgba(255, 111, 165, .22);
      transform: scale(1.015);
    }
    .field .ico { font-size: 1.35rem; transition: transform .4s var(--spring); }
    .field:focus-within .ico { transform: rotate(-18deg) scale(1.2); }
    .field input {
      flex: 1; min-width: 0;
      padding: 16px 0;
      font: 700 1.05rem var(--body); color: var(--plum);
      background: none; border: 0; outline: none;
    }
    .field input::placeholder { color: #c9a3b8; font-weight: 600; }

    /* botón caramelo */
    .btn {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 0 34px; min-height: 58px;
      font: 600 1.2rem var(--display); letter-spacing: .01em; color: #fff;
      background: linear-gradient(120deg, #ff7eb3, #ff4d8d 45%, #ff7eb3 90%);
      background-size: 220% 100%;
      border: 0; border-radius: 999px;
      box-shadow: 0 7px 0 var(--pink-600), 0 16px 30px rgba(240, 70, 138, .4);
      cursor: pointer;
      transition: transform .18s var(--spring), box-shadow .18s, background-position .6s;
      text-shadow: 0 2px 0 rgba(160, 20, 80, .35);
    }
    .btn::after {  /* brillo que cruza */
      content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
      transform: skewX(-20deg);
    }
    .btn:hover { transform: translateY(-3px); background-position: 100% 0; box-shadow: 0 10px 0 var(--pink-600), 0 22px 36px rgba(240, 70, 138, .45); }
    .btn:hover::after { animation: shine .8s ease; }
    @keyframes shine { to { left: 130%; } }
    .btn:active { transform: translateY(5px) scale(.97, .94); box-shadow: 0 2px 0 var(--pink-600), 0 6px 14px rgba(240, 70, 138, .35); transition-duration: .06s; }
    .btn:focus-visible, .chip:focus-visible, .pill:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }
    .btn .paw { display: inline-block; transition: transform .4s var(--spring); }
    .btn:hover .paw { transform: rotate(-20deg) scale(1.25); }
    .btn:disabled { cursor: wait; filter: saturate(.85); }
    .btn:disabled:hover { transform: translateY(3px); box-shadow: 0 4px 0 var(--pink-600), 0 10px 20px rgba(240, 70, 138, .35); }

    .btn .dots { display: none; gap: 6px; }
    .btn.busy .dots { display: inline-flex; }
    .btn.busy .btn-label, .btn.busy .paw { display: none; }
    .dots i {
      width: 11px; height: 11px; border-radius: 50%; background: #fff;
      animation: dot .8s var(--ease-out) infinite;
    }
    .dots i:nth-child(2) { animation-delay: .12s; }
    .dots i:nth-child(3) { animation-delay: .24s; }
    @keyframes dot { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-9px) scale(1.15); } }

    .ripple {
      position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .55);
      transform: translate(-50%, -50%) scale(0); pointer-events: none;
      animation: ripple .65s ease-out forwards;
    }
    @keyframes ripple { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

    /* chips de ejemplo */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
    .chips > span { font-weight: 700; color: var(--plum-soft); margin-right: 2px; }
    .chip {
      padding: 8px 15px;
      font: 700 .92rem var(--body); color: var(--pink-600);
      background: var(--pink-100); border: 2px solid var(--pink-200); border-radius: 999px;
      cursor: pointer;
      transition: transform .25s var(--spring), background .2s, color .2s, border-color .2s;
    }
    .chip:hover { transform: translateY(-3px) rotate(-2deg); background: var(--pink-400); border-color: var(--pink-400); color: #fff; }
    .chip:active { transform: scale(.94); }

    .status {
      min-height: 1.6em; margin: 18px 4px 0;
      font-weight: 700; color: var(--plum-soft);
    }
    .status.error { color: #c81e5b; }

    /* ---------- resultados ---------- */
    #resultado { margin-top: 30px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }

    .card {
      position: relative;
      padding: 20px 22px;
      background: #fff;
      border: 3px solid var(--pink-100);
      border-radius: 28px;
      box-shadow: 0 6px 0 var(--pink-100);
    }
    .stat small { display: block; margin-bottom: 4px; font-weight: 800; color: var(--pink-500); }
    .stat strong { display: block; font: 600 1.35rem/1.25 var(--display); overflow-wrap: anywhere; }
    .stat .emoji { position: absolute; top: 12px; right: 16px; font-size: 1.6rem; }

    .card h2 { margin: 0 0 14px; font: 600 1.3rem var(--display); }

    .pop { animation: cardPop .6s var(--spring) both; animation-delay: calc(var(--i) * 110ms); }
    @keyframes cardPop {
      0% { opacity: 0; transform: translateY(26px) scale(.86) rotate(-2deg); }
      100% { opacity: 1; transform: none; }
    }

    .links { margin-top: 16px; }
    .pills { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .pill {
      display: inline-block; max-width: 100%;
      padding: 9px 16px;
      font-weight: 700; font-size: .95rem; color: var(--plum); text-decoration: none;
      background: linear-gradient(180deg, #fff, var(--pink-50));
      border: 2px solid var(--pink-200); border-radius: 999px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: transform .25s var(--spring), background .2s, color .2s, border-color .2s;
    }
    .pill:hover { transform: translateY(-3px) scale(1.04); background: var(--pink-400); border-color: var(--pink-400); color: #fff; }

    /* captura dentro de una ventana con orejitas */
    .shot { margin-top: 30px; perspective: 1100px; }
    .browser {
      position: relative;
      background: #fff;
      border: 4px solid var(--pink-300);
      border-radius: 24px;
      box-shadow: 0 10px 0 var(--pink-300), 0 30px 50px rgba(240, 70, 138, .25);
      transition: transform .25s var(--ease-out);
      transform-style: preserve-3d;
    }
    .browser::before, .browser::after {  /* orejitas */
      content: ''; position: absolute; top: -34px; width: 46px; height: 46px;
      background: var(--pink-300);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      border-radius: 6px;
      z-index: -1;
    }
    .browser::before { left: 34px; transform: rotate(-14deg); }
    .browser::after { right: 34px; transform: rotate(14deg); }
    .bar {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px;
      background: var(--pink-100);
      border-bottom: 3px solid var(--pink-200);
      border-radius: 18px 18px 0 0;
    }
    .bar i { width: 13px; height: 13px; border-radius: 50%; }
    .bar i:nth-child(1) { background: #ff6fa5; }
    .bar i:nth-child(2) { background: #ffb3d1; }
    .bar i:nth-child(3) { background: #d9c2ff; }
    .bar .url {
      flex: 1; margin-left: 8px; padding: 5px 14px;
      font-weight: 700; font-size: .85rem; color: var(--plum-soft);
      background: #fff; border-radius: 999px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .browser img { display: block; width: 100%; height: auto; border-radius: 0 0 18px 18px; }

    [hidden] { display: none !important; }

    /* ---------- gato: partes ---------- */
    .cat .head { transform-box: fill-box; transform-origin: 50% 100%; }
    .cat .head-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 5s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    .cat .body { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.03); } }
    .cat .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: tail 2.6s ease-in-out infinite; }
    @keyframes tail { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
    .cat .ear { transform-box: fill-box; transform-origin: 50% 100%; animation: twitch 6s ease-in-out infinite; }
    .cat .ear-r { animation-delay: -2.6s; }
    @keyframes twitch { 0%, 88%, 100% { transform: rotate(0); } 91% { transform: rotate(-10deg); } 94% { transform: rotate(4deg); } 97% { transform: rotate(-3deg); } }
    .cat .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5s infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.06); } }
    .cat .pupil { transform: translate(calc(var(--px, 0) * 1px), calc(var(--py, 0) * 1px)); transition: transform .12s ease-out; }
    .cat .eye-happy { display: none; }
    .cat .paw { transform-box: fill-box; transform-origin: 50% 100%; }
    .cat .lid-heart { transform-box: fill-box; transform-origin: 50% 50%; }
    .cat .tear { opacity: 0; }

    /* estados globales */
    body[data-state="loading"] .hero-cat .paw-l { animation: type .34s ease-in-out infinite; }
    body[data-state="loading"] .hero-cat .paw-r { animation: type .34s ease-in-out infinite -.17s; }
    @keyframes type { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
    body[data-state="loading"] .hero-cat .lid-heart { animation: heartbeat .6s ease-in-out infinite; }
    @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    body[data-state="loading"] .hero-cat .head-sway { animation: bob .5s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(3px); } }
    body[data-state="loading"] .hero-cat .tail { animation-duration: .7s; }

    body[data-state="success"] .eye { display: none; }
    body[data-state="success"] .eye-happy { display: block; }
    body[data-state="success"] .cat .tail { animation-duration: .5s; }
    body[data-state="success"] .cat .head-sway { animation-duration: .8s; }
    body[data-state="success"] .cat-wrap.jump { animation: jump .9s var(--ease-out); }
    @keyframes jump {
      0% { transform: translateY(0) scale(1, 1); }
      14% { transform: translateY(0) scale(1.1, .88); }
      45% { transform: translateY(-46px) scale(.93, 1.1); }
      75% { transform: translateY(0) scale(1.08, .9); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    body[data-state="error"] .cat .ear-l { animation: none; transform: rotate(-26deg); }
    body[data-state="error"] .cat .ear-r { animation: none; transform: rotate(26deg); }
    body[data-state="error"] .cat .head-sway { animation: none; transform: rotate(-7deg); }
    body[data-state="error"] .cat .tail { animation: none; transform: rotate(14deg); }
    body[data-state="error"] .hero-cat .tear { animation: tear 1.6s ease-in infinite; }
    @keyframes tear { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(26px); } }

    /* clic en el gato */
    .cat-wrap.purr { animation: wiggle .7s var(--spring); }

    /* ---------- efectos ---------- */
    .burst { position: fixed; z-index: 50; pointer-events: none; line-height: 1; font-size: 22px; will-change: transform; }

    @media (max-width: 560px) {
      .peek { width: 80px; top: -60px; }
      .panel { margin-top: 58px; }
      .btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important; animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      .particles { display: none; }
    }
  </style>
</head>
<body data-state="idle">
  <div class="blobs" aria-hidden="true"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <main>
    <header class="hero">
      <div class="stage" id="stage">
        <div class="cat-wrap" id="heroWrap" tabindex="0" role="button" aria-label="Acariciar a la gatita"></div>
      </div>
      <h1 id="title" aria-label="Gatitos Playwright">Gatitos Playwright</h1>
      <p class="tagline">Pega una dirección web y mi gatita abre la página con Playwright, lee lo importante y te trae una foto.</p>
    </header>

    <section class="panel">
      <div class="peek left" id="peekL" aria-hidden="true"></div>
      <div class="peek right" id="peekR" aria-hidden="true"></div>

      <form id="form" class="search">
        <label class="field">
          <span class="ico" aria-hidden="true">🐾</span>
          <input id="url" value="https://example.com" placeholder="https://tu-pagina.com" aria-label="Dirección web" required>
        </label>
        <button class="btn" id="btn" type="submit">
          <span class="paw" aria-hidden="true">🐾</span>
          <span class="btn-label">Ejecutar</span>
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
      </form>

      <div class="chips">
        <span>Prueba con:</span>
        <button type="button" class="chip" data-url="https://example.com">example.com</button>
        <button type="button" class="chip" data-url="https://playwright.dev">playwright.dev</button>
        <button type="button" class="chip" data-url="https://es.wikipedia.org/wiki/Gato">Wikipedia: Gato</button>
        <button type="button" class="chip" data-url="https://quotes.toscrape.com">quotes.toscrape.com</button>
      </div>

      <p id="estado" class="status" role="status" aria-live="polite"></p>

      <section id="resultado" hidden>
        <div class="stats">
          <article class="card stat pop" style="--i:0"><span class="emoji" aria-hidden="true">📝</span><small>Título</small><strong id="titulo"></strong></article>
          <article class="card stat pop" style="--i:1"><span class="emoji" aria-hidden="true">🔎</span><small>Primer &lt;h1&gt;</small><strong id="h1"></strong></article>
          <article class="card stat pop" style="--i:2"><span class="emoji" aria-hidden="true">⏱️</span><small>Tiempo</small><strong><span id="ms">0</span> ms</strong></article>
        </div>

        <article class="card links pop" style="--i:3">
          <h2>Primeros enlaces</h2>
          <ul id="enlaces" class="pills"></ul>
        </article>

        <div class="shot pop" style="--i:4" id="shot">
          <div class="browser" id="browser">
            <div class="bar"><i></i><i></i><i></i><span class="url" id="urlfinal"></span></div>
            <img id="captura" alt="Captura de la página">
          </div>
        </div>
      </section>
    </section>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const calmMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= gatitos (SVG generado) ================= */
  function headMarkup(c) {
    const eye = x => `
      <g class="eye">
        <ellipse cx="${x}" cy="126" rx="14" ry="16" fill="#fff"/>
        <g class="pupil">
          <ellipse cx="${x}" cy="128" rx="10.5" ry="13" fill="${c.iris}"/>
          <ellipse cx="${x}" cy="129" rx="6" ry="9" fill="#3b1a34"/>
          <circle cx="${x + 3.5}" cy="122.5" r="4" fill="#fff"/>
          <circle cx="${x - 3.5}" cy="134" r="1.8" fill="#fff" opacity=".85"/>
        </g>
      </g>
      <path class="eye-happy" d="M${x - 13} 131 Q${x} 112 ${x + 13} 131" fill="none" stroke="#3b1a34" stroke-width="4.5" stroke-linecap="round"/>`;
    return `
      <g class="ear ear-l">
        <path d="M88 108 Q78 56 92 40 Q97 37 102 42 L136 74 Z" fill="${c.fur}" stroke="${c.line}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M97 92 Q92 64 98 53 L121 75 Z" fill="${c.inner}"/>
      </g>
      <g class="ear ear-r">
        <path d="M212 108 Q222 56 208 40 Q203 37 198 42 L164 74 Z" fill="${c.fur}" stroke="${c.line}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M203 92 Q208 64 202 53 L179 75 Z" fill="${c.inner}"/>
      </g>
      <ellipse cx="150" cy="128" rx="68" ry="58" fill="${c.fur}" stroke="${c.line}" stroke-width="3"/>
      <path d="M150 74 v15 M137 76 l3 12 M163 76 l-3 12" stroke="${c.stripe}" stroke-width="5" stroke-linecap="round" fill="none"/>
      ${eye(122)}${eye(178)}
      <ellipse cx="98" cy="148" rx="12" ry="7.5" fill="#ff8fb5" opacity=".55"/>
      <ellipse cx="202" cy="148" rx="12" ry="7.5" fill="#ff8fb5" opacity=".55"/>
      <path d="M143 144 Q150 139 157 144 Q150 153 143 144Z" fill="#ff6fa5"/>
      <path d="M150 150 v4 M150 154 Q143 162 135 156 M150 154 Q157 162 165 156" fill="none" stroke="#8a4b64" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M94 143 L58 136 M94 151 L56 154 M206 143 L242 136 M206 151 L244 154" stroke="${c.whisker}" stroke-width="2.4" stroke-linecap="round"/>`;
  }

  const FUR = {
    white: { fur: '#fffafc', line: '#ffb3cf', inner: '#ffa8c6', stripe: '#ffcfe0', whisker: '#e8a6c0', iris: '#a78bff' },
    peach: { fur: '#ffd3ae', line: '#f2a672', inner: '#ff9dbb', stripe: '#f39a63', whisker: '#e59a72', iris: '#3fbfa8' },
    gray:  { fur: '#d8d2e6', line: '#a99fc4', inner: '#ffa8c6', stripe: '#9d93bb', whisker: '#a99fc4', iris: '#ffb347' },
  };

  function heroCat() {
    const c = FUR.white;
    return `
    <svg class="cat hero-cat" viewBox="0 0 300 292" data-cx=".5" data-cy=".44" aria-hidden="true">
      <ellipse cx="150" cy="282" rx="102" ry="8" fill="#f0468a" opacity=".16"/>
      <g class="tail"><path d="M212 252 C276 258 294 200 266 164" fill="none" stroke="${c.line}" stroke-width="28" stroke-linecap="round"/>
        <path d="M212 252 C276 258 294 200 266 164" fill="none" stroke="${c.fur}" stroke-width="22" stroke-linecap="round"/>
        <path d="M280 196 q-14 -3 -24 6 M274 178 q-12 -4 -21 4" fill="none" stroke="${c.stripe}" stroke-width="5" stroke-linecap="round"/></g>
      <g class="body">
        <ellipse cx="150" cy="216" rx="72" ry="60" fill="${c.fur}" stroke="${c.line}" stroke-width="3"/>
        <ellipse cx="150" cy="232" rx="40" ry="36" fill="#fff"/>
      </g>
      <g class="head-sway"><g class="head">${headMarkup(c)}
        <path class="tear" d="M96 140 q5 9 0 13 q-5 -4 0 -13z" fill="#7cc7ff"/>
      </g></g>
      <g class="laptop">
        <rect x="94" y="206" width="112" height="60" rx="12" fill="#ffc2d6" stroke="#ff8fb5" stroke-width="3"/>
        <path class="lid-heart" d="M150 251 C131 239 129 224 141 224 C146 224 150 228 150 232 C150 228 154 224 159 224 C171 224 169 239 150 251Z" fill="#fff"/>
        <rect x="80" y="262" width="140" height="13" rx="6.5" fill="#ff8fb5" stroke="#ff6fa5" stroke-width="2"/>
        <rect x="128" y="266" width="44" height="4" rx="2" fill="#ff6fa5" opacity=".5"/>
      </g>
      <g class="paw paw-l"><ellipse cx="126" cy="207" rx="16" ry="12" fill="${c.fur}" stroke="${c.line}" stroke-width="3"/>
        <path d="M120 209 v-5 M126 210 v-6 M132 209 v-5" stroke="${c.line}" stroke-width="2" stroke-linecap="round"/></g>
      <g class="paw paw-r"><ellipse cx="174" cy="207" rx="16" ry="12" fill="${c.fur}" stroke="${c.line}" stroke-width="3"/>
        <path d="M168 209 v-5 M174 210 v-6 M180 209 v-5" stroke="${c.line}" stroke-width="2" stroke-linecap="round"/></g>
    </svg>`;
  }

  function peekCat(c) {
    return `
    <svg class="cat" viewBox="70 30 160 184" data-cx=".5" data-cy=".53" aria-hidden="true">
      <g class="head-sway"><g class="head">${headMarkup(c)}</g></g>
      <ellipse cx="116" cy="196" rx="17" ry="12" fill="${c.fur}" stroke="${c.line}" stroke-width="3"/>
      <ellipse cx="184" cy="196" rx="17" ry="12" fill="${c.fur}" stroke="${c.line}" stroke-width="3"/>
    </svg>`;
  }

  $('heroWrap').innerHTML = heroCat();
  $('peekL').innerHTML = peekCat(FUR.peach);
  $('peekR').innerHTML = peekCat(FUR.gray);

  /* ================= título con letras saltarinas ================= */
  const title = $('title');
  title.textContent = '';
  let n = 0;
  'Gatitos Playwright'.split(' ').forEach((word, w, words) => {
    const box = document.createElement('span');
    box.className = 'word';
    box.setAttribute('aria-hidden', 'true');
    [...word].forEach(ch => {
      const s = document.createElement('span');
      s.className = 'letter';
      s.style.setProperty('--i', n);
      const t = n++ / 16;                              // degradé rosa → lila
      s.style.color = `hsl(${338 - t * 62} ${78 + t * 6}% ${58 - t * 4}%)`;
      s.textContent = ch;
      box.append(s);
    });
    title.append(box);
    if (w < words.length - 1) { title.append(' '); n++; }
  });

  /* ================= ojos que siguen al mouse ================= */
  const cats = [...document.querySelectorAll('svg.cat')];
  let mouse = { x: innerWidth / 2, y: innerHeight / 2 };
  addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; look(); });
  addEventListener('scroll', () => look(), { passive: true });

  function look() {
    const state = document.body.dataset.state;
    const heroRect = $('heroWrap').getBoundingClientRect();
    const hero = { x: heroRect.left + heroRect.width / 2, y: heroRect.top + heroRect.height * .45 };
    for (const svg of cats) {
      const isHero = svg.classList.contains('hero-cat');
      if (isHero && state === 'loading') { svg.style.setProperty('--px', 0); svg.style.setProperty('--py', 4); continue; }
      const r = svg.getBoundingClientRect();
      const cx = r.left + r.width * +svg.dataset.cx, cy = r.top + r.height * +svg.dataset.cy;
      const target = state === 'loading' ? hero : mouse;
      const dx = target.x - cx, dy = target.y - cy;
      const k = Math.min(1, Math.hypot(dx, dy) / 220) / (Math.hypot(dx, dy) || 1);
      svg.style.setProperty('--px', (dx * k * 3.6).toFixed(2));
      svg.style.setProperty('--py', (dy * k * 3.2).toFixed(2));
    }
  }
  look();

  /* ================= estados ================= */
  function setState(state) {
    document.body.dataset.state = state;
    look();
  }
  setState('idle');

  /* ================= confeti de corazones ================= */
  function burst(x, y, n = 16, list = ['💗', '💖', '✨', '🐾', '💕', '🌸']) {
    if (calmMotion) return;
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'burst';
      el.textContent = list[(Math.random() * list.length) | 0];
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.fontSize = (16 + Math.random() * 18) + 'px';
      document.body.append(el);
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 130;
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d - 60;
      el.animate([
        { transform: 'translate(-50%,-50%) scale(.2) rotate(0)', opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1) rotate(${(Math.random() - .5) * 140}deg)`, opacity: 1, offset: .6 },
        { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 70}px)) scale(.8) rotate(${(Math.random() - .5) * 200}deg)`, opacity: 0 },
      ], { duration: 900 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => el.remove();
    }
  }
  const centerOf = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

  /* acariciar gatitos */
  function pet(el) {
    el.classList.remove('purr'); void el.offsetWidth; el.classList.add('purr');
    burst(...centerOf(el), 10, ['💗', '💕', '✨']);
  }
  $('heroWrap').addEventListener('click', () => pet($('heroWrap')));
  $('heroWrap').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pet($('heroWrap')); } });
  for (const id of ['peekL', 'peekR']) $(id).addEventListener('click', () => burst(...centerOf($(id)), 8, ['💗', '🐾', '✨']));

  /* ================= partículas de fondo ================= */
  if (!calmMotion) {
    const box = $('particles'), icons = ['💗', '🐾', '✨', '🌸', '💕', '🐾'];
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('span');
      p.className = 'particle';
      p.textContent = icons[i % icons.length];
      p.style.left = (Math.random() * 100) + '%';
      p.style.fontSize = (14 + Math.random() * 20) + 'px';
      p.style.animationDuration = (16 + Math.random() * 16) + 's';
      p.style.animationDelay = (-Math.random() * 30) + 's';
      p.style.setProperty('--sway', (Math.random() * 80 - 40) + 'px');
      p.style.setProperty('--spin', (Math.random() * 120 - 60) + 'deg');
      p.style.setProperty('--o', (.25 + Math.random() * .35).toFixed(2));
      box.append(p);
    }
  }

  /* ================= botones: onda al hacer clic ================= */
  $('btn').addEventListener('pointerdown', e => {
    const b = e.currentTarget, r = b.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2.4;
    const rp = document.createElement('span');
    rp.className = 'ripple';
    rp.style.cssText = `left:${e.clientX - r.left}px;top:${e.clientY - r.top}px;width:${size}px;height:${size}px`;
    b.append(rp); setTimeout(() => rp.remove(), 700);
    burst(e.clientX, e.clientY, 8, ['💗', '✨', '🐾']);
  });

  document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
    $('url').value = chip.dataset.url;
    $('form').requestSubmit();
  }));

  /* ================= captura con inclinación 3D ================= */
  const shot = $('shot'), browser = $('browser');
  shot.addEventListener('pointermove', e => {
    if (calmMotion) return;
    const r = shot.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    browser.style.transform = `rotateY(${x * 9}deg) rotateX(${-y * 7}deg)`;
  });
  shot.addEventListener('pointerleave', () => { browser.style.transform = ''; });

  function countUp(el, to) {
    if (calmMotion) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 900;
    (function tick(t) {
      const k = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  }

  /* ================= la llamada real a Playwright ================= */
  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('btn');
    btn.disabled = true; btn.classList.add('busy');
    $('estado').className = 'status';
    $('estado').textContent = 'Playwright está abriendo la página…';
    $('resultado').hidden = true;
    setState('loading');

    try {
      const res = await fetch('/api/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: $('url').value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      $('titulo').textContent = data.titulo || '(sin título)';
      $('h1').textContent = data.h1 || '(no tiene)';
      $('urlfinal').textContent = data.url;
      $('enlaces').replaceChildren(...data.enlaces.map(l => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'pill';
        a.href = l.href; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = l.texto || l.href;
        li.append(a);
        return li;
      }));
      $('captura').src = 'data:image/png;base64,' + data.captura;
      $('estado').textContent = 'Listo: ' + data.url;
      $('resultado').hidden = false;
      countUp($('ms'), data.ms);

      setState('success');
      const wrap = $('heroWrap');
      wrap.classList.remove('jump'); void wrap.offsetWidth; wrap.classList.add('jump');
      burst(...centerOf(wrap), 30);
      $('resultado').scrollIntoView({ behavior: calmMotion ? 'auto' : 'smooth', block: 'nearest' });
      setTimeout(() => { if (document.body.dataset.state === 'success') setState('idle'); }, 5200);
    } catch (err) {
      $('estado').className = 'status error';
      $('estado').textContent = 'No se pudo abrir la página: ' + err.message;
      setState('error');
    } finally {
      btn.disabled = false; btn.classList.remove('busy');
    }
  });
</script>
</body>
</html>
